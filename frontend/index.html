<!doctype html>
<html lang="it">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="">
  <meta name="author" content="Francesco Bonzi">
  <title>BeeCal</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="shortcut icon" href="/calendar.png" type="image/x-icon" />

  <style>
    div h1 a {
      color: #212529;
      text-decoration: none;
    }

    div h1 a:hover {
      color: #212529;
      text-decoration: none;
    }

    #box {
      background-color: #ffffff;
      padding: 20px;
      border-radius: 10px;
    }

    @media (prefers-color-scheme: dark) {
      #box {
        background-color: #212529;
        box-shadow: 0 0 5px rgba(255, 255, 255, 0.1);
      }

      body {
        background-color: #111;
      }
    }

    @media (prefers-color-scheme: light) {
      #box {
        background-color: #fff;
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
      }

      body {
        background-color: #f8f9fa;
      }
    }
  </style>
</head>

<body>
  <div class="container" id="main-container">
    <div id="app">
      <div class="text-center">
        <div class="spinner-border mt-5" role="status"></div>Attendi &hellip;
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
  <!-- FOOTER -->
  <figure class="text-center mt-5">
    <figcaption class="blockquote-footer">
      Segui il progetto su <a href="https://github.com/FrancescoBonzi/UniboCalendar">GitHub</a>
    </figcaption>
  </figure>
</body>

</html>
